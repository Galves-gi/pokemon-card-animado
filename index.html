<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Links -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="icon" href="./images/logo.png">
  <link rel="stylesheet" href="./css/card_pokemon.css">

  <title>Pokédex</title>
</head>

<body>
  <header>
    <div class="header--mobile">
      <!-- logo -->
      <img src="/images/logo.png" alt="logo pokedex" id="logo">
      <!-- icone do menu -->
      <button class="botao_menu icone_menu icone-X">
        <span class="bar" id="bar1"></span>
        <span class="bar" id="bar2"></span>
        <span class="bar" id="bar3"></span>
      </button>
    </div>

    <nav class="header_nav">
      <!-- input de pesquisa -->
      <form action="" class="form">
        <input type="search" name="buscar" id="buscar" class="input__pesquisar" placeholder="Pesquisar pokémon...">
      </form>

      <!-- botão para gerar número de pokemon aleátorio  -->
      <button type="submit" class="btn-aleatorio">Aleatório</button>
    </nav>

  </header>

  <p class="aviso">Conecta na Internet</p>

  <main>

    <div class="container">
      <!-- botão de voltar -->
      <button class="botoes_mudar">
        <i class="bi bi-chevron-compact-left btn-voltar"></i>
      </button>

      <section class="card">
        <!-- parte da frente -->
        <article class="card-front">
          <div class="card-front_corpo">
            <!-- icone e nome -->
            <div class="card-front_nome-icon flexivel ">

              <span class="card-front_faixa">
                <span class="flexivel icones">
                  <!-- imgs dos icones -->
                </span>

                <h1 class="pokemon__nome"></h1>
              </span>

              <!-- nivel HP -->
              <h2>
                <sub>HP</sub>
                <sup class="pokemon__hp">00</sup>
              </h2>

            </div>

            <!-- imgagem pokemon -->
            <img src="/images/icones/icone-padrao.png" alt="pokemon" class="pokemon__imagem">

            <!-- Informações de ataque, defesa e velocidade -->
            <div class="card-front_infor ">

              <div class="container-paralelogramo">
                <h3 class="pokemon__ataque card-front_paralelogramo">Attack</h3>
                <p class="pokemon__ataque-dano card-front_paralelogramo-valor">+00</p>
              </div>

              <div class="container-paralelogramo">
                <h3 class="pokemon__defesa card-front_paralelogramo">Defense</h3>
                <p class="pokemon__defesa-valor card-front_paralelogramo-valor">+00</p>
              </div>

              <div class="container-paralelogramo">
                <h3 class="pokemon__velocidade card-front_paralelogramo">Speed</h3>
                <p class="pokemon__velocidade-valor card-front_paralelogramo-valor">+00</p>
              </div>

            </div>

          </div>
        </article>

        <!-- parte de trás -->
        <img src="/images/card-verso.png" alt="" srcset="" class="card-back">

      </section>
      <!-- botão de proximo -->
      <button class="botoes_mudar">
        <i class="bi bi-chevron-compact-right btn-prox"></i>
      </button>

    </div>
  </main>

  <script src="/js/script.js"></script>
</body>

</html>
