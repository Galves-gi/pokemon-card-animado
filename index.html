<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Links -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="icon" href="./images/logo.png">
  <link rel="stylesheet" href="./css/card_pokemon.css">

  <!-- Main JS -->
  <script defer src="./js/script.js"></script>

  <title>Pokédex - Card Animado</title>
</head>

<body>
  <header>
    <div class="header--mobile">
      <img src="/images/logo.png" alt="logo pokedex" id="logo">
      <button class="botao_menu">
        <i class="bi bi-list icone_menu"></i>
      </button>
    </div>


    <nav class="header_nav">
      <form action="" class="form">
        <input type="search" name="buscar" id="buscar" class="input__pesquisar"
          placeholder="Pesquisar pokémon por nome ou id...">
      </form>

      <button type="submit" class="btn-primario">Aleatório</button>
    </nav>

  </header>

  <!--         
        

       
        <h1 class="pokemon__infor">
          <span class="pokemon__id"></span> -
          <span class="pokemon__nome"></span>
        </h1> -->

  <main>
    <button class="botoes btn-prev"> <i class="bi bi-chevron-compact-left"></i></button>

    <section class="card">
      <article class="card-front">
        <div class="card-front_corpo">

          <div class="card-front_nome-icon flexivel ">
            <span class="card-front_faixa flexivel">
              <img src="/images/icones/icone-padrao.png" alt="" class="pokemon__icone">

              <h1 class="pokemon__nome"></h1>
            </span>

            <h2><sub>HP</sub><sup class="pokemon__hp">00</sup></h2>
          </div>


          <img src="/images/logo.png" alt="pokemon" class="pokemon__imagem">

          <div>
            <!-- <div class="card-front_infor-tipo">
              <h3>Typo:</h3>
              <p class="pokemon__tipo">Elétrico, Fogo</p>
            </div> -->

            <div class="card-front_infor flexivel ">

              <div class="teste">
                <h3 class="pokemon__ataque card-front_paralelogramo">Attack</h3>
                <p class="pokemon__ataque-dano card-front_paralelogramo-valor">+00</p>
              </div>

              <div class="teste">
                <h3 class="pokemon__defesa card-front_paralelogramo">Defense</h3>
                <p class="pokemon__defesa-valor card-front_paralelogramo-valor">+00</p>
              </div>

              <div class="teste">
                <h3 class="pokemon__velocidade card-front_paralelogramo">Speed</h3>
                <p class="pokemon__velocidade-valor card-front_paralelogramo-valor">+00</p>
              </div>

            </div>

            <!-- <div>
              <p class="pokemon__descricao card-front_descricao">When this Pokémon has 1/3 or less of its HP remaining, its fire-type moves
                inflict 1.5× as much regular damage.</p>
            </div> -->
          </div>

        </div>
      </article>

      <!-- parte de trás -->
      <img src="/images/card-verso.png" alt="" srcset="" class="card-back">

    </section>

    <button class="botoes btn-next"><i class="bi bi-chevron-compact-right"></i></button>
  </main>

  <script src="/js/script.js"></script>
</body>

</html>
